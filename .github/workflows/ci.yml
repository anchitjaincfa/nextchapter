name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static demo boundaries
        run: bash scripts/guard-demo-boundaries.sh
      - name: Reject obvious committed secrets
        shell: bash
        run: |
          if git grep -nEI '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|sk-[A-Za-z0-9]{32,}|service_role[[:space:]]*[:=])' -- . ':!docs/*'; then
            echo "::error::Possible secret committed"
            exit 1
          fi

  application:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build --if-present